<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opstellingen</title>
<meta name="theme-color" content="#2456B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Opstelling">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232456B8'/%3E%3Crect x='14' y='30' width='72' height='48' fill='%23EF8A3A' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='14' y1='54' x2='86' y2='54' stroke='%23fff' stroke-width='2' stroke-dasharray='4 3'/%3E%3Cline x1='38' y1='30' x2='38' y2='78' stroke='%23fff' stroke-width='2'/%3E%3Cline x1='62' y1='30' x2='62' y2='78' stroke='%23fff' stroke-width='2'/%3E%3Cline x1='8' y1='24' x2='92' y2='24' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232456B8'/%3E%3Crect x='14' y='30' width='72' height='48' fill='%23EF8A3A' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='14' y1='54' x2='86' y2='54' stroke='%23fff' stroke-width='2' stroke-dasharray='4 3'/%3E%3Cline x1='38' y1='30' x2='38' y2='78' stroke='%23fff' stroke-width='2'/%3E%3Cline x1='62' y1='30' x2='62' y2='78' stroke='%23fff' stroke-width='2'/%3E%3Cline x1='8' y1='24' x2='92' y2='24' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Opstellingen%22%2C%22short_name%22%3A%22Opstelling%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23EEF1F5%22%2C%22theme_color%22%3A%22%232456B8%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage/svg%2Bxml%2C%253Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%253E%253Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%25232456B8%27/%253E%253Crect%20x%3D%2714%27%20y%3D%2730%27%20width%3D%2772%27%20height%3D%2748%27%20fill%3D%27%2523EF8A3A%27%20stroke%3D%27%2523fff%27%20stroke-width%3D%273%27/%253E%253Cline%20x1%3D%2714%27%20y1%3D%2754%27%20x2%3D%2786%27%20y2%3D%2754%27%20stroke%3D%27%2523fff%27%20stroke-width%3D%272%27%20stroke-dasharray%3D%274%203%27/%253E%253Cline%20x1%3D%2738%27%20y1%3D%2730%27%20x2%3D%2738%27%20y2%3D%2778%27%20stroke%3D%27%2523fff%27%20stroke-width%3D%272%27/%253E%253Cline%20x1%3D%2762%27%20y1%3D%2730%27%20x2%3D%2762%27%20y2%3D%2778%27%20stroke%3D%27%2523fff%27%20stroke-width%3D%272%27/%253E%253Cline%20x1%3D%278%27%20y1%3D%2724%27%20x2%3D%2792%27%20y2%3D%2724%27%20stroke%3D%27%2523fff%27%20stroke-width%3D%275%27/%253E%253C/svg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image/svg%2Bxml%22%7D%5D%7D">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F5; --paper:#FFFFFF; --ink:#101B33; --mute:#5C6780; --line:#D5DAE3;
    --court:#EF8A3A; --court-dk:#D4722A; --zone:#2456B8; --zone-dk:#1A4394; --ok:#1F8A4C; --warn:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
  h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
  h1{font-size:34px;line-height:1}
  h2{font-size:22px}
  h3{font-size:17px;font-weight:500;color:var(--mute)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:6px}
  button:hover{border-color:var(--ink)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  button.primary:hover{background:#243456}
  button.ghost{border-color:transparent;color:var(--mute);padding:4px 8px}
  button.ghost:hover{color:var(--warn);border-color:transparent}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7AA2FF;outline-offset:1px}
  input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
  input[type=date]{padding:6px 9px}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  header input.team{font-family:"Barlow Condensed";font-size:34px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0 0 2px;background:transparent;width:min(420px,90vw)}
  .status{color:var(--mute);font-size:13px}
  .io{display:flex;gap:6px;margin-top:6px}.io button{padding:5px 10px;font-size:13px}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
  .side{display:grid;gap:22px}
  .grid>*,.side>*{min-width:0}
  .roster{table-layout:fixed}
  .roster td:first-child{width:56px}.roster td:nth-child(3){width:64px}.roster td:last-child{width:32px}
  .addrow input{min-width:0}
  .tabs{display:none}
  @media(max-width:840px){
    .wrap{padding:14px 12px 96px}
    h1,header input.team{font-size:26px}
    header{margin-bottom:14px}
    .grid{grid-template-columns:1fr;gap:14px}
    .side{order:2}
    .panel{padding:12px;border-radius:8px}
    .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tabs button{flex:1 1 0;min-width:0;padding:10px 4px;font-family:"Barlow Condensed";font-weight:700;font-size:17px}
    .tabs button.on{background:var(--zone);color:#fff;border-color:var(--zone)}
    .tabs button.done{border-color:var(--ink)}
    .sets{grid-template-columns:1fr;gap:0}
    .set{display:none;border:0;padding:0;background:transparent}
    .set.active{display:block}
    .set h2{font-size:26px}
    .pos{min-height:66px}
    .pos select,.pos button{font-size:19px;padding:22px 3px 8px}
    .actions{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);z-index:5;gap:6px}
    .actions button{padding:12px 10px;flex:1 1 auto;font-size:14px}
    .actions .msg{flex-basis:100%;text-align:center;order:-1;margin:0;min-height:0}
    .actions .msg:empty{display:none}
    .actions #print{display:none}
    button,input,select{font-size:16px}
    .roster input.nr{width:44px;padding:7px 4px}
    .roster .tag label{padding:6px 7px}
    .hist li{grid-template-columns:70px 1fr;grid-template-rows:auto auto;gap:2px 10px}
    .hist li > span:last-child{grid-column:1/-1;display:flex;gap:4px}
    .hist li > span:last-child button{flex:1;padding:8px}
  }
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
  .panel h2{margin-bottom:12px}
  /* roster */
  .roster{width:100%;border-collapse:collapse}
  .roster td{padding:3px 2px;border-bottom:1px solid var(--line)}
  .roster input.nr{width:48px;text-align:center;font-weight:600}
  .roster input.nm{width:100%}
  .roster .tag{display:inline-flex;gap:2px}
  .roster .tag label{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;cursor:pointer;color:var(--mute);user-select:none}
  .roster .tag input{display:none}
  .roster .tag input:checked+span{background:var(--ink);color:#fff}
  .roster .tag label span{display:block;margin:-2px -5px;padding:2px 5px;border-radius:3px}
  .addrow{margin-top:10px;display:flex;gap:8px}
  /* match */
  .matchhead{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:center;margin-bottom:14px}
  @media(max-width:560px){.matchhead{grid-template-columns:1fr 1fr}.matchhead #opp{grid-column:1/-1}.matchhead .seg{justify-self:end}.seg button{padding:9px 16px}}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px}
  .seg button.on{background:var(--zone);color:#fff}
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .set{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FAFBFD}
  .set .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .set .score{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
  .set .score input{width:42px;text-align:center;padding:4px}
  .court{background:var(--zone);padding:10px 10px 12px;border-radius:8px}
  .net{height:0;border-top:3px solid #fff;margin:0 -10px 8px;position:relative}
  .net:after{content:"net";position:absolute;right:10px;top:-19px;color:#fff;font-size:11px;letter-spacing:.06em;opacity:.8}
  .floor{background:var(--court);border:2px solid #fff;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:0}
  .pos{position:relative;border:1px solid rgba(255,255,255,.55);min-height:58px;display:flex;align-items:stretch;min-width:0}
  .pos:nth-child(-n+3){border-bottom:2px dashed #fff}
  .pos small{position:absolute;left:4px;top:3px;font-size:10px;color:#fff;font-family:"Barlow Condensed";font-weight:700;letter-spacing:.04em}
  .pos select{appearance:none;-webkit-appearance:none;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:#fff;font:700 17px/1.1 "Barlow Condensed";text-align:center;padding:16px 2px 6px;border-radius:0}
  .pos select:hover{background:rgba(255,255,255,.12)}
  .pos select option{color:var(--ink);font:15px Barlow}
  .pos.dup select{background:rgba(179,38,30,.55)}

  .pos button{width:100%;border:0;border-radius:0;background:transparent;color:#fff;font:700 17px/1.1 "Barlow Condensed";padding:16px 2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
  .pos button:hover{background:rgba(255,255,255,.15)}
  .pos button:disabled{cursor:default;opacity:.85}
  .pos button i{position:absolute;right:3px;top:3px;font:600 9px Barlow;font-style:normal;background:#fff;color:var(--zone);border-radius:3px;padding:0 3px}
  .lockrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--mute)}
  .sublog{font-size:13px;padding:4px 0;line-height:1.4}
  .modal{position:fixed;inset:0;background:rgba(16,27,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--paper);width:100%;max-width:420px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
  .sheet p{margin:0;color:var(--mute)}
  .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .choices button{padding:12px 8px;font-family:"Barlow Condensed";font-weight:700;font-size:18px;border-color:var(--zone);color:var(--zone)}
  .choices button:hover{background:var(--zone);color:#fff}
  .sheet label{font-size:12px;color:var(--mute);display:grid;gap:4px}
  @media(min-width:841px){.modal{align-items:center}.sheet{border-radius:14px}}
  .set .extra{margin-top:8px;display:grid;gap:6px}
  .set .extra label{font-size:12px;color:var(--mute);display:block}
  .set .extra select,.set .extra input{width:100%}
  .bench{margin-top:10px;font-size:12px;color:var(--mute)}
  .bench b{color:var(--ink);font-weight:600}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .msg{font-size:13px;color:var(--ok)}
  /* history */
  .hist{list-style:none;margin:0;padding:0}
  .hist li{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .hist li.cur{background:#F3F6FC;margin:0 -8px;padding:9px 8px;border-radius:6px}
  .hist .d{font-family:"Barlow Condensed";font-weight:700;font-size:18px}
  .hist .o{font-weight:500}.hist .o span{color:var(--mute);font-weight:400}
  .hist .r{font-size:13px;color:var(--mute)}
  .empty{color:var(--mute);padding:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h3>Opstellingen</h3>
      <input class="team" id="team" placeholder="Ploegnaam">
    </div>
    <div><div class="status" id="status">…</div><div class="io"><button id="exp">Exporteer</button><button id="imp">Importeer</button><input type="file" id="impFile" accept=".json,application/json" hidden></div></div>
  </header>

  <div class="grid">
    <div class="side" id="side">
      <section class="panel">
        <h2>Spelers</h2>
        <table class="roster" id="roster"></table>
        <div class="addrow">
          <input class="nr" id="newNr" placeholder="Nr" inputmode="numeric" style="width:56px">
          <input id="newNm" placeholder="Naam" style="flex:1">
          <button class="primary" id="addBtn">Voeg toe</button>
        </div>
      </section>

      <section class="panel">
        <h2>Historie</h2>
        <ul class="hist" id="hist"></ul>
      </section>
    </div>

    <section class="panel" id="match">
      <div class="matchhead">
        <input id="opp" placeholder="Tegenstander">
        <input type="date" id="date">
        <div class="seg"><button id="home">Thuis</button><button id="away">Uit</button></div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="sets" id="sets"></div>
      <div class="actions">
        <button class="primary" id="save">Bewaar wedstrijd</button>
        <button id="new">Nieuwe wedstrijd</button>
        <button id="copyPrev">Kopieer set 1 naar alle sets</button>
        <button id="print">Afdrukken</button>
        <span class="msg" id="msg"></span>
      </div>
    </section>
  </div>
</div>

<script>
const KEY='vb-lineups:v1';
const POS=[['IV','Linksvoor'],['III','Midvoor'],['II','Rechtsvoor'],['V','Linksachter'],['VI','Midachter'],['I','Rechtsachter · service']];
let data={team:'',roster:[],matches:[]};
let cur=blankMatch();
let saveTimer=null;
let activeSet=0;

function uid(){return Math.random().toString(36).slice(2,9)}
function blankMatch(){return{id:uid(),opp:'',date:new Date().toISOString().slice(0,10),home:true,
  sets:Array.from({length:5},()=>newSet())}}
function newSet(){return{pos:['','','','','',''],libero:'',notes:'',subs:[],locked:false,us:'',them:''}}
function migrate(){data.matches.forEach(m=>m.sets.forEach(fix));cur.sets.forEach(fix)}
function fix(st){if(typeof st.subs==='string'){st.notes=st.subs;st.subs=[]}if(!Array.isArray(st.subs))st.subs=[];if(st.notes===undefined)st.notes='';if(st.locked===undefined)st.locked=st.subs.length>0}

// ---------- persistence (localStorage als het kan, anders artifact-opslag)
const store=(()=>{
  try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);
    return{name:'localStorage',get:async()=>localStorage.getItem(KEY),set:async v=>localStorage.setItem(KEY,v)}}
  catch(e){}
  if(window.storage&&window.storage.get)return{name:'artifact',get:async()=>{const r=await window.storage.get(KEY,false);return r?r.value:null},set:async v=>window.storage.set(KEY,v,false)};
  let mem=null;return{name:'sessie',get:async()=>mem,set:async v=>{mem=v}};
})();
async function load(){
  try{const v=await store.get();if(v)data=Object.assign(data,JSON.parse(v))}catch(e){}
  migrate();
  setStatus(store.name==='localStorage'?'Bewaard in de browser van dit apparaat':store.name==='artifact'?'Bewaard in Claude':'Niet bewaard – alleen deze sessie');
  renderAll();
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await store.set(JSON.stringify(data))}
    catch(e){setStatus('Kon niet bewaren – blijft alleen in deze sessie')}
  },400);
}
function setStatus(t){document.getElementById('status').textContent=t}
function flash(t){const m=document.getElementById('msg');m.textContent=t;setTimeout(()=>{if(m.textContent===t)m.textContent=''},2500)}

// ---------- roster
function renderRoster(){
  const t=document.getElementById('roster');t.innerHTML='';
  data.roster.sort((a,b)=>(+a.nr||999)-(+b.nr||999));
  if(!data.roster.length){t.innerHTML='<tr><td class="empty">Nog geen spelers. Voeg hieronder je ploeg toe.</td></tr>';return}
  data.roster.forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><input class="nr" value="${esc(p.nr)}" inputmode="numeric"></td>
      <td><input class="nm" value="${esc(p.name)}"></td>
      <td><span class="tag"><label title="Libero"><input type="checkbox" ${p.lib?'checked':''}><span>L</span></label>
      <label title="Kapitein"><input type="checkbox" ${p.cap?'checked':''}><span>C</span></label></span></td>
      <td><button class="ghost" title="Verwijder">×</button></td>`;
    const [nr,nm,lib,cap]=tr.querySelectorAll('input');
    nr.onchange=()=>{p.nr=nr.value.trim();persist();renderRoster();renderSets()};
    nm.onchange=()=>{p.name=nm.value.trim();persist();renderSets()};
    lib.onchange=()=>{p.lib=lib.checked;persist();renderSets()};
    cap.onchange=()=>{p.cap=cap.checked;persist()};
    tr.querySelector('button').onclick=()=>{if(confirm(`${p.name} verwijderen uit de ploeg?`)){data.roster=data.roster.filter(x=>x!==p);persist();renderRoster();renderSets()}};
    t.appendChild(tr);
  });
}
document.getElementById('addBtn').onclick=addPlayer;
document.getElementById('newNm').onkeydown=e=>{if(e.key==='Enter')addPlayer()};
function addPlayer(){
  const nr=document.getElementById('newNr'),nm=document.getElementById('newNm');
  if(!nm.value.trim())return nm.focus();
  data.roster.push({id:uid(),nr:nr.value.trim(),name:nm.value.trim(),lib:false,cap:false});
  nr.value='';nm.value='';nr.focus();persist();renderRoster();renderSets();
}
const player=id=>data.roster.find(p=>p.id===id);
const label=p=>p?`${p.nr?p.nr+' ':''}${p.name}`:'';


// ---------- wisselregels
// current lineup = startopstelling + toegepaste wissels
function lineup(st){const l=[...st.pos];st.subs.forEach(w=>{l[w.k]=w.in});return l}
// wie mag er in voor de speler op positie k?
function allowedSubs(st,k){
  const l=lineup(st);const out=l[k];if(!out)return[];
  if(st.subs.length>=6)return[];
  const starter=st.pos[k];
  const pairIn=st.subs.filter(w=>w.k===k);          // wissels op deze positie
  if(pairIn.length>=2)return[];                        // koppel afgerond
  if(out!==starter)return [player(starter)].filter(Boolean); // wisselspeler eruit -> alleen de starter terug
  // starter eruit: enkel bankspelers die nog in geen enkel koppel zitten, geen libero
  const busy=new Set(st.subs.flatMap(w=>[w.in,w.out]));
  const onCourt=new Set(l);
  return data.roster.filter(p=>!onCourt.has(p.id)&&p.id!==st.libero&&!p.lib&&!busy.has(p.id)&&!st.pos.includes(p.id));
}
function subText(st){
  return st.subs.map(w=>{const a=player(w.out),b=player(w.in);return `${a?a.nr||a.name:'?'} → ${b?b.nr||b.name:'?'}${w.score?' ('+w.score+')':''}`}).join(', ');
}
let modal=null;
function openSub(st,k){
  const out=player(lineup(st)[k]);const opts=allowedSubs(st,k);
  closeModal();
  modal=document.createElement('div');modal.className='modal';
  modal.innerHTML=`<div class="sheet"><h2>Wissel op ${POS[k][0]}</h2>
    <p>${esc(label(out))} gaat eruit. ${opts.length?'Wie komt erin?':st.subs.length>=6?'Maximum van 6 wissels bereikt.':'Geen toegestane wissel meer voor deze positie.'}</p>
    <div class="choices">${opts.map(p=>`<button data-id="${p.id}">${esc(label(p))}</button>`).join('')}</div>
    <label>Stand bij wissel <input id="subScore" placeholder="bv. 18-20" inputmode="numeric"></label>
    <button class="ghost" id="cancelSub">Annuleer</button></div>`;
  modal.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{
    st.subs.push({k,out:out.id,in:b.dataset.id,score:modal.querySelector('#subScore').value.trim()});
    closeModal();renderSets();flash('Wissel vastgelegd');
  });
  modal.querySelector('#cancelSub').onclick=closeModal;
  modal.onclick=e=>{if(e.target===modal)closeModal()};
  document.body.appendChild(modal);
}
function closeModal(){if(modal){modal.remove();modal=null}}

// ---------- match
document.getElementById('team').oninput=e=>{data.team=e.target.value;persist()};
document.getElementById('opp').oninput=e=>{cur.opp=e.target.value};
document.getElementById('date').onchange=e=>{cur.date=e.target.value};
document.getElementById('home').onclick=()=>{cur.home=true;renderHead()};
document.getElementById('away').onclick=()=>{cur.home=false;renderHead()};
function renderHead(){
  document.getElementById('team').value=data.team;
  document.getElementById('opp').value=cur.opp;
  document.getElementById('date').value=cur.date;
  document.getElementById('home').classList.toggle('on',cur.home);
  document.getElementById('away').classList.toggle('on',!cur.home);
}
function renderSets(){
  const box=document.getElementById('sets');box.innerHTML='';
  const opts=sel=>'<option value="">–</option>'+data.roster.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(label(p))}</option>`).join('');
  cur.sets.forEach((st,i)=>{
    const el=document.createElement('div');el.className='set'+(i===activeSet?' active':'');
    const l=lineup(st);const used=st.pos.filter(Boolean);
    const cells=POS.map((p,k)=>{
      if(!st.locked)return `<div class="pos ${st.pos[k]&&used.filter(x=>x===st.pos[k]).length>1?'dup':''}"><small>${p[0]}</small><select title="${p[1]}" data-k="${k}">${opts(st.pos[k])}</select></div>`;
      const pl=player(l[k]);const can=allowedSubs(st,k).length>0;
      return `<div class="pos live ${can?'':'nosub'}"><small>${p[0]}</small><button data-k="${k}" ${can?'':'disabled'} title="${can?'Wissel':'Geen wissel mogelijk'}">${esc(pl?label(pl):'–')}${l[k]!==st.pos[k]?'<i>in</i>':''}</button></div>`;
    }).join('');
    const full=used.length===6&&new Set(used).size===6;
    el.innerHTML=`<div class="top"><h2>Set ${i+1}</h2>
        <span class="score"><input value="${esc(st.us)}" placeholder="wij" inputmode="numeric"> – <input value="${esc(st.them)}" placeholder="zij" inputmode="numeric"></span></div>
      <div class="court"><div class="net"></div><div class="floor">${cells}</div></div>
      <div class="lockrow">${st.locked
        ?`<span class="hint">Tik op een speler om te wisselen (${st.subs.length}/6)</span>${st.subs.length?'<button class="ghost" data-undo>Laatste wissel ongedaan</button>':'<button class="ghost" data-unlock>Opstelling aanpassen</button>'}`
        :`<button class="primary" data-lock ${full?'':'disabled'}>Opstelling bevestigen</button><span class="hint">${full?'':'Vul eerst alle zes posities in'}</span>`}</div>
      <div class="extra">
        <div><label>Libero</label><select data-lib>${'<option value="">–</option>'+data.roster.filter(p=>p.lib||p.id===st.libero).map(p=>`<option value="${p.id}" ${p.id===st.libero?'selected':''}>${esc(label(p))}</option>`).join('')}</select></div>
        <div><label>Wissels</label><div class="sublog">${st.subs.length?esc(subText(st)):'<span class="hint">nog geen</span>'}</div></div>
        <div><label>Notities</label><input data-notes value="${esc(st.notes)}" placeholder="bv. time-out bij 20-23"></div>
      </div>
      <div class="bench">${benchText(st)}</div>`;
    el.querySelectorAll('.pos select').forEach(sl=>sl.onchange=()=>{st.pos[+sl.dataset.k]=sl.value;renderSets()});
    el.querySelectorAll('.pos button').forEach(b=>b.onclick=()=>openSub(st,+b.dataset.k));
    const lock=el.querySelector('[data-lock]');if(lock)lock.onclick=()=>{st.locked=true;renderSets()};
    const unlock=el.querySelector('[data-unlock]');if(unlock)unlock.onclick=()=>{st.locked=false;renderSets()};
    const undo=el.querySelector('[data-undo]');if(undo)undo.onclick=()=>{st.subs.pop();renderSets()};
    el.querySelector('[data-lib]').onchange=e=>{st.libero=e.target.value;renderSets()};
    el.querySelector('[data-notes]').oninput=e=>{st.notes=e.target.value};
    const [us,them]=el.querySelectorAll('.score input');
    us.oninput=()=>st.us=us.value;them.oninput=()=>st.them=them.value;
    box.appendChild(el);
  });
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  cur.sets.forEach((st,i)=>{const b=document.createElement('button');b.textContent='Set '+(i+1);
    b.className=(i===activeSet?'on':'')+(st.locked?' done':'');
    b.onclick=()=>{activeSet=i;renderSets()};tabs.appendChild(b)});
}
function benchText(s){
  const on=new Set([...lineup(s),s.libero].filter(Boolean));
  const b=data.roster.filter(p=>!on.has(p.id)).map(p=>p.nr||p.name.split(' ')[0]);
  const dup=s.pos.filter(Boolean).some((x,i,a)=>a.indexOf(x)!==i);
  return (dup?'<span style="color:var(--warn)">Zelfde speler staat twee keer op het veld.</span> ':'')+(b.length?`Bank: <b>${b.join(', ')}</b>`:'Iedereen staat op het veld.');
}

// ---------- history
document.getElementById('save').onclick=()=>{
  if(!cur.opp.trim()){flash('Vul eerst de tegenstander in');document.getElementById('opp').focus();return}
  const i=data.matches.findIndex(m=>m.id===cur.id);
  const copy=JSON.parse(JSON.stringify(cur));
  if(i>=0)data.matches[i]=copy;else data.matches.push(copy);
  persist();renderHist();flash('Wedstrijd bewaard');
};
document.getElementById('new').onclick=()=>{cur=blankMatch();activeSet=0;renderHead();renderSets();renderHist();document.getElementById('opp').focus()};
document.getElementById('copyPrev').onclick=()=>{
  const s1=cur.sets[0];cur.sets.forEach((s,i)=>{if(i&&!s.subs.length){s.pos=[...s1.pos];s.libero=s1.libero}});renderSets();flash('Set 1 gekopieerd naar set 2–5');
};
document.getElementById('print').onclick=()=>window.print();
document.getElementById('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`opstellingen-${(data.team||'ploeg').replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.json`;a.click();
};
document.getElementById('imp').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.roster)||!Array.isArray(d.matches))throw 0;
    if(!confirm(`${d.roster.length} spelers en ${d.matches.length} wedstrijden importeren? Dit vervangt wat hier staat.`))return;
    data=d;migrate();cur=blankMatch();activeSet=0;persist();renderAll();flash('Geïmporteerd')}
  catch(err){alert('Dit bestand is geen geldige export van deze app.')}
  e.target.value='';
};
function renderHist(){
  const ul=document.getElementById('hist');ul.innerHTML='';
  const ms=[...data.matches].sort((a,b)=>b.date.localeCompare(a.date));
  if(!ms.length){ul.innerHTML='<li class="empty">Bewaarde wedstrijden verschijnen hier.</li>';return}
  ms.forEach(m=>{
    const li=document.createElement('li');if(m.id===cur.id)li.classList.add('cur');
    const sets=m.sets.filter(s=>s.us!==''||s.them!=='');
    const won=sets.filter(s=>+s.us>+s.them).length,lost=sets.filter(s=>+s.them>+s.us).length;
    li.innerHTML=`<span class="d">${fmt(m.date)}</span>
      <span><div class="o">${esc(m.opp)} <span>${m.home?'thuis':'uit'}</span></div>
      <div class="r">${sets.length?`${won}–${lost} · `+sets.map(s=>`${s.us}-${s.them}`).join(', '):'geen uitslag'}</div></span>
      <span><button class="ghost" title="Openen">Open</button><button class="ghost" title="Kopie als nieuwe wedstrijd">Kopie</button><button class="ghost" title="Verwijder">×</button></span>`;
    const [op,cp,del]=li.querySelectorAll('button');
    op.onclick=()=>{cur=JSON.parse(JSON.stringify(m));activeSet=0;renderHead();document.getElementById('match').scrollIntoView({behavior:'smooth'});renderSets();renderHist()};
    cp.onclick=()=>{cur=JSON.parse(JSON.stringify(m));activeSet=0;cur.id=uid();cur.opp='';cur.date=new Date().toISOString().slice(0,10);cur.sets.forEach(s=>{s.us='';s.them='';s.subs=[];s.notes='';s.locked=false});renderHead();renderSets();renderHist();document.getElementById('match').scrollIntoView({behavior:'smooth'});flash('Opstelling overgenomen')};
    del.onclick=()=>{if(confirm(`Wedstrijd tegen ${m.opp} verwijderen?`)){data.matches=data.matches.filter(x=>x.id!==m.id);persist();renderHist()}};
    ul.appendChild(li);
  });
}
const fmt=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return `${dd}/${m}/${y.slice(2)}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderAll(){renderHead();renderRoster();renderSets();renderHist()}
load();
</script>
</body>
</html>
